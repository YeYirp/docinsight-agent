name: 问题反馈
description: 报告解析、检索、回答或界面上的异常
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先跑一下 `./mvnw test`，如果测试也复现，请把失败输出贴进来。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 做了什么、期望什么、实际发生了什么
      placeholder: 上传 PDF 后知识库文档数没有变化……
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽量给出可重复的最小步骤，包含涉及的文档类型和大小
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与接口响应
      description: 控制台异常、/api/health 返回、浏览器 Network 里的响应体；敏感信息请自行打码
      render: shell
  - type: dropdown
    id: model-config
    attributes:
      label: 模型配置
      description: 便于判断问题出在检索还是生成阶段
      options:
        - 未配置任何 Key（抽取式回答）
        - 只配置 LLM
        - LLM 与 Embedding 都配置了
        - 不确定
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Java 版本、启动方式、是否设置 SQLITE_VEC_EXTENSION
      placeholder: Windows 11 / JDK 21 / ./mvnw spring-boot:run
    validations:
      required: true
